name: Rust Build and Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  RUSTC_WRAPPER: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Update repository values
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          (grep -rlZ "PLACEHOLDER_VERSION" . --exclude-dir=.git --exclude-dir=target || test "$?" -eq 1) |
            xargs -0 -r sed -i "s:PLACEHOLDER_VERSION:$TAG_VERSION:g"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold clang

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build (Release Mode)
        run: cargo build --locked --release --verbose

      - name: Package and Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW_BIN="tapes-x86_64-unknown-linux-gnu"
          ARCHIVE_NAME="${RAW_BIN}-${GITHUB_REF_NAME}"

          cp target/release/tapes "$RAW_BIN"

          mkdir -p "$ARCHIVE_NAME"
          cp target/release/tapes "$ARCHIVE_NAME/"
          tar -czf "${ARCHIVE_NAME}.tgz" "$ARCHIVE_NAME"

          gh release create "$GITHUB_REF_NAME" "$RAW_BIN" "${ARCHIVE_NAME}.tgz" \
            --verify-tag \
            --title "Release $GITHUB_REF_NAME" \
            --generate-notes
